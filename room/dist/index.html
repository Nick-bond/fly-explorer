<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fly Explorer Room</title>
  <style>
    :root {
      --bg: #101318;
      --hud-bg: rgba(16, 19, 24, 0.72);
      --hud-text: #e8e4da;
      --hud-dim: #9aa0a8;
      --accent: #c9a227;
      --ok: #7dbb6e;
      --bad: #c96a5a;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--hud-text);
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #scene.dragging { cursor: grabbing; }
    .hud {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .panel {
      background: var(--hud-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(232, 228, 218, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .panel h1 {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .panel .dims {
      margin: 0;
      font-size: 12px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    .panel .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--hud-dim);
    }
    .panel .hint b {
      color: var(--hud-text);
      font-weight: 600;
    }
    #brain-status[data-status="connected"] { color: var(--ok); }
    #brain-status[data-status="disconnected"],
    #brain-status[data-status="connecting"] { color: var(--bad); }
    @media (max-width: 480px) {
      .kbd-hint { display: none; }
    }
    .eyes {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }
    .eye {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .eye canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      border: 1px solid rgba(232, 228, 218, 0.25);
      border-radius: 4px;
      background: #000;
    }
    .eye span {
      font-size: 11px;
      color: var(--hud-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CjzL4iOD.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="panel">
      <h1>Fly Explorer Room</h1>
      <p class="dims">6.0 m &times; 6.0 m &times; 3.0 m &middot; floor grid = 1 m</p>
      <p class="hint">fly &ldquo;curious explorer&rdquo; shown at 25&times; scale</p>
      <p class="hint">brain: <span id="brain-status">disconnected</span></p>
      <p class="hint" id="map-stats">episode 1 &middot; deaths 0 &middot; explored 0.0%</p>
    </div>
    <div class="panel">
      <p class="hint"><b>Drag</b> to look around</p>
      <p class="hint kbd-hint"><b>W A S D</b> / arrows to walk &middot; <b>Q</b>/<b>E</b> up &amp; down &middot; <b>M</b> map</p>
    </div>
  </div>

  <div class="eyes panel">
    <div class="eye"><canvas id="eye-left"></canvas><span>left eye</span></div>
    <div class="eye"><canvas id="eye-right"></canvas><span>right eye</span></div>
  </div>

</body>
</html>
